apiVersion: v1
kind: PersistentVolume
metadata:
  name: vikunja-data-pv
spec:
  nfs:
    server: 192.168.0.176
    path: /data/vikunja
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: vikunja-db-pv
spec:
  local:
    path: /data/vikunjadb
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - hyperion
