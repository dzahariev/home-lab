apiVersion: v1
kind: PersistentVolume
metadata:
  name: vikunja-db-pv
spec:
  capacity:
    storage: 500Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    namespace: vikunja
    name: vikunja-db
  storageClassName: local-storage
  local:
    path: /data/vikunjadb
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - <node-name>
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: vikunja-data-pv
spec:
  capacity:
    storage: 500Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    namespace: vikunja
    name: vikunja-data
  storageClassName: nfs-storage
  nfs:
    server: <nfs-server>
    path: /data/vikunja
