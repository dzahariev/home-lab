apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mirini
  namespace: mirini
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
  - host: mirini.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mirini
            port:
              number: 8800
  tls:
  - hosts:
    - mirini.example.com
    secretName: mirini-tls
